name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/session-yk6nza]
  workflow_dispatch:

# Permissions nécessaires au déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Oral/
      # Repli SPA : toute route inconnue sert l'app (React Router)
      - run: cp dist/index.html dist/404.html
      # --- Site « Sérène » (modèle Dentiva reconstruit) -> /Oral/serene/ ---
      - name: Build site Sérène
        run: |
          cd serene
          npm install --no-audit --no-fund
          VITE_BASE=/Oral/serene/ npm run build
          cp dist/index.html dist/404.html
          mkdir -p ../dist/serene
          cp -r dist/* ../dist/serene/
      # --- Site 2 : export Framer OralCare traduit en français (/comparaison/) ---
      - name: Build site 2 (Framer FR)
        continue-on-error: true
        run: |
          bash _site2/build.sh
          mkdir -p dist/comparaison
          cp -r _site2/site/* dist/comparaison/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
