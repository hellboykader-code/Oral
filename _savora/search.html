<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Search</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #1a1a2e; padding: 2rem; }
.search-container { max-width: 640px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin-bottom: 1rem; }
input[type="search"] { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; transition: border-color 0.2s; }
input[type="search"]:focus { border-color: #6366f1; }
.results { margin-top: 1.5rem; }
.result-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; text-decoration: none; display: block; color: inherit; transition: box-shadow 0.2s; }
.result-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.result-title { font-weight: 600; color: #4f46e5; margin-bottom: 0.25rem; }
.result-path { font-size: 0.8rem; color: #64748b; margin-bottom: 0.25rem; }
.result-excerpt { font-size: 0.9rem; color: #475569; }
.no-results { color: #94a3b8; text-align: center; padding: 2rem 0; }
.count { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.75rem; }
</style>
<style id="savora-clean">a[href^="https://framer.link"],a[href^="http://framer.link"],[data-framer-name="Remove This Buy Button"],[data-framer-name="Remove Button"],[data-framer-name^="Crafted By"],[data-framer-name^="Made in"],[data-framer-name^="Made By"]{display:none !important;}</style></head>
<body>
<div class="search-container">
<h1>Search</h1>
<input type="search" id="q" placeholder="Search pages..." autofocus>
<div class="results" id="results"></div>
</div>
<script>
(function() {
var pages = [{"path":"/","title":"Savora","description":"Savaro is a modern restaurant Framer template with a clean layout, smooth flow, and easy navigation. Perfect for showing menus, taking bookings, and creating a strong online presence.","excerpt":"Modern dining with unforgettable flavors and inspired recipes."},{"path":"/about","title":"Savora","description":"Savaro is a modern restaurant Framer template with a clean layout, smooth flow, and easy navigation. Perfect for showing menus, taking bookings, and creating a strong online presence.","excerpt":"Managing Partner"},{"path":"/blogs","title":"Savora","description":"Savaro is a modern restaurant Framer template with a clean layout, smooth flow, and easy navigation. Perfect for showing menus, taking bookings, and creating a strong online presence.","excerpt":"26 janv. 2026"},{"path":"/contact-us","title":"Savora","description":"Savaro is a modern restaurant Framer template with a clean layout, smooth flow, and easy navigation. Perfect for showing menus, taking bookings, and creating a strong online presence.","excerpt":"Have a question about reservations, private events, or our menu? Reach out to us and we’ll respond as soon as possible."},{"path":"/events","title":"Savora","description":"Savaro is a modern restaurant Framer template with a clean layout, smooth flow, and easy navigation. Perfect for showing menus, taking bookings, and creating a strong online presence.","excerpt":"A festive gathering of bold flavors, signature dishes, and unforgettable food moments."},{"path":"/fr","title":"Savora","description":"Savaro est un modèle Framer moderne pour restaurant avec une mise en page épurée, une navigation fluide et facile. Idéal pour présenter les menus, prendre des réservations et créer une forte présence en ligne.","excerpt":"Une cuisine moderne aux saveurs inoubliables et aux recettes inspirées."},{"path":"/menu","title":"Savora","description":"Savaro is a modern restaurant Framer template with a clean layout, smooth flow, and easy navigation. Perfect for showing menus, taking bookings, and creating a strong online presence.","excerpt":"Plan your visit and enjoy a memorable dining experience with exceptional food and warm hospitality."},{"path":"/reservation","title":"Savora","description":"Savaro is a modern restaurant Framer template with a clean layout, smooth flow, and easy navigation. Perfect for showing menus, taking bookings, and creating a strong online presence.","excerpt":"Plan your visit and enjoy thoughtfully crafted dishes, warm hospitality, and moments worth savaring at Savaro."}];
var input = document.getElementById('q');
var resultsEl = document.getElementById('results');

function search(query) {
    if (!query || query.length < 2) { resultsEl.innerHTML = ''; return; }
    var q = query.toLowerCase();
    var matches = pages.filter(function(p) {
        return (p.title && p.title.toLowerCase().indexOf(q) !== -1) ||
               (p.description && p.description.toLowerCase().indexOf(q) !== -1) ||
               (p.excerpt && p.excerpt.toLowerCase().indexOf(q) !== -1);
    });
    if (matches.length === 0) {
        resultsEl.innerHTML = '<div class="no-results">No results found.</div>';
        return;
    }
    var html = '<div class="count">' + matches.length + ' result(s)</div>';
    matches.forEach(function(p) {
        var href = p.path === '/' ? 'index.html' : p.path.replace(/^\//, '') + '/index.html';
        html += '<a class="result-item" href="' + href + '">' +
            '<div class="result-title">' + esc(p.title || 'Untitled') + '</div>' +
            '<div class="result-path">' + esc(p.path) + '</div>' +
            '<div class="result-excerpt">' + esc(p.excerpt || p.description || '') + '</div>' +
            '</a>';
    });
    resultsEl.innerHTML = html;
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

input.addEventListener('input', function() { search(this.value); });
})();
</script>
<script id="savora-fix">(function(){function money(v){v=v.replace(/\$\s*(\d+)(?:[.,](\d{2}))?/g,function(m,a,b){return a+(b?","+b:"")+" \u20ac";});v=v.replace(/(\d+)(?:[.,](\d{2}))?\s*\$/g,function(m,a,b){return a+(b?","+b:"")+" \u20ac";});return v;}function fix(){var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n;while(n=w.nextNode()){var v=n.nodeValue;if(!v||v.indexOf("$")<0)continue;var k=v.trim();if(k==="$"){n.nodeValue="";continue;}var nv=money(v);if(nv!==v)n.nodeValue=nv;}}function start(){fix();try{new MutationObserver(fix).observe(document.body,{childList:true,subtree:true});}catch(e){}var c=0,iv=setInterval(function(){fix();if(++c>30)clearInterval(iv);},500);}if(document.readyState==="complete"){setTimeout(start,1800);}else{window.addEventListener("load",function(){setTimeout(start,1800);});}})();</script></body>
</html>
